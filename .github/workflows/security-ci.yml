name: Segurança e qualidade

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Lint, testes, build e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_apenas_teste
      PA_PAINEL_ATIVO: "false"

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Instalar dependências sem scripts de instalação
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: node --test src/lib/*.test.mjs

      - name: Validar build de produção
        run: npm run build
