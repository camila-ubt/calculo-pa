name: Publicar release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/publicar-release.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicar-release
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar versão do package.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ler e validar a versão
        id: versao
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida no package.json: $VERSION" >&2
            exit 1
          fi

          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Criar a release se ela ainda não existir
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release $TAG já existe."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Cálculo PA $TAG" \
            --generate-notes
