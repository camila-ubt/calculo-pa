name: Publicar Wiki

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  # Releases criadas com GITHUB_TOKEN não disparam outro workflow de release.
  workflow_run:
    workflows: ["Publicar release"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publicar-wiki.yml"
      - "scripts/atualizar-versao-wiki*.mjs"

permissions:
  contents: write

concurrency:
  group: publicar-wiki
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validar atualização da versão
        run: node --test scripts/atualizar-versao-wiki.test.mjs

      - name: Consultar última release estável
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/atualizar-versao-wiki.mjs

      - name: Publicar páginas na Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -av --delete --exclude=".git" docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki já está atualizada."
            exit 0
          fi
          git commit -m "docs: atualiza Wiki do Cálculo PA"
          git push origin master
