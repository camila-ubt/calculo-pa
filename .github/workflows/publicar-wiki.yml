name: Publicar Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publicar-wiki.yml"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Publicar páginas na Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -av --delete --exclude=".git" docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki já está atualizada."
            exit 0
          fi
          git commit -m "docs: atualiza Wiki do Cálculo PA"
          git push origin master
